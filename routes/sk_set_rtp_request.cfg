route[SET_RTP_REQUEST] {
    #Check if the method is anything other than UPDATE or INVITE, 
	if (!is_method("UPDATE|INVITE")) {
        return;
	}

    if (sdp_content()) {
        $avp(originalSDP) = $rb;

		if(is_method("UPDATE|INVITE")) {
			rtpengine_offer("replace-origin replace-session-connection ICE=remove");
			setflag(SDP_OFFER_RECV);
		} else if(is_method("ACK")) {
			rtpengine_answer("replace-origin replace-session-connection ICE=remove");
			setflag(SDP_ANSWER_RECV);
		}
    } 
}
